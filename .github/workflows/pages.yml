name: Validate and deploy Pages

on:
  pull_request:
  push:
    branches: ["claude/beautiful-allen-ub85cz"]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check-site.py
      - run: node tools/share.test.mjs
      - run: node tools/core-harness.mjs
      - name: Stage the validated public file
        run: python3 tools/check-site.py --out _site
      - name: Upload this commit's Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale commits and require the Actions publishing source
        uses: actions/github-script@v7
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: context.ref.replace('refs/heads/', '')
            });
            if (branch.commit.sha !== context.sha) {
              throw new Error('A newer release commit exists; refusing stale deployment.');
            }
            const { data: pages } = await github.rest.repos.getPages(context.repo);
            if (pages.build_type !== 'workflow') {
              throw new Error('Before merging, set Settings > Pages > Source to GitHub Actions.');
            }
      - name: Deploy only the artifact from this validated commit
        id: deployment
        uses: actions/deploy-pages@v4
